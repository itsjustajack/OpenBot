name: Phone app

# Builds the Android phone app (mobile/) as an installable APK, with Needle inside it for the Phone
# Bot. Runs on pull requests and changes to mobile/ on main, and by hand from the Actions tab ("Run workflow").
# The APK is attached to the run as "OpenBot-phone" (a .zip to download and unpack on the phone).
#
# Signed with the Expo template's fixed debug key, the same on every build, so a newer build installs
# over an older one. Fine for testing; a release key comes later.
on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/phone-app.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/phone-app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # Optional: the OpenBot PC's public https address, set as a repository variable. Without it
      # the app opens straight to the Phone Bot.
      EXPO_PUBLIC_SERVER_URL: ${{ vars.OPENBOT_SERVER_URL }}
      NEEDLE_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Use Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Install
        run: npm ci
      # Needle's files come from Hugging Face. They're kept between builds so a build doesn't depend
      # on downloading them every time. Bump the key when the pinned version in get-needle.mjs changes.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            mobile/modules/needle/android/libs
            mobile/modules/needle/assets/needle3.cact
          key: needle3-b274efcb211a9eef48c9a88da4b43bd569696a39
      - name: Get Needle's engine and model
        run: npm run get-needle
        env:
          # Optional: a free Hugging Face read token, if Hugging Face ever asks builds to sign in.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Make the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk OpenBot-phone.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenBot-phone
          path: mobile/OpenBot-phone.apk
          retention-days: 30
